<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self'" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" />
<style>
  :root { --background: 220 20% 6%; --card: 220 18% 10%; --primary: 24 100% 50%; --foreground: 0 0% 95%; --border: 220 14% 18%; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; font-family: Cairo, "Segoe UI", sans-serif; user-select: none; overflow: hidden; }
  .menu {
    margin: 6px; padding: 6px; border-radius: 16px;
    background: hsl(var(--card) / .96); color: hsl(var(--foreground));
    border: 1px solid hsl(var(--border));
    box-shadow: 0 10px 30px hsl(0 0% 0% / .55), 0 0 0 1px hsl(var(--primary) / .08), 0 0 24px hsl(var(--primary) / .12);
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; border-bottom: 1px solid hsl(var(--border)); margin-bottom: 4px; }
  .head img { width: 28px; height: 28px; border-radius: 8px; }
  .head b { font-size: 15px; }
  .head span { font-size: 11px; color: hsl(var(--primary)); display: block; line-height: 1; }
  button {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 10px;
    background: transparent; color: inherit; font: 600 13px Cairo, sans-serif; cursor: pointer; text-align: right;
  }
  button:hover { background: hsl(var(--primary) / .14); color: hsl(var(--primary)); }
  button svg { width: 16px; height: 16px; flex: none; }
  .sep { height: 1px; background: hsl(var(--border)); margin: 4px 6px; }
  .danger:hover { background: hsl(0 80% 55% / .14); color: hsl(0 85% 62%); }
  .check { margin-inline-start: auto; font-size: 12px; color: hsl(var(--primary)); opacity: 0; }
  .on .check { opacity: 1; }
</style>
</head>
<body>
  <div class="menu">
    <div class="head"><img src="build/icon.png" alt="" /><div><b>Series</b><span></span></div></div>
    <button data-a="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/></svg>فتح Series</button>
    <button data-a="messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>الرسائل</button>
    <button data-a="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.7H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10.3 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
    <div class="sep"></div>
    <button data-a="quit" class="danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>إغلاق Series نهائيًا</button>
  </div>
<script>
  const root = document.documentElement;
  const refresh = () => tray.autostart().then((on) => document.getElementById("auto").classList.toggle("on", on));
  tray.onTheme((t) => { for (const k in t) if (t[k]) root.style.setProperty("--" + k, t[k]); refresh(); });
  document.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => tray.act(b.dataset.a)));
  addEventListener("keydown", (e) => { if (e.key === "Escape") tray.act("close"); });
  refresh();
</script>
</body>
</html>
